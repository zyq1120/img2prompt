<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1 data-i18n="popupTitle">最近生成</h1>
      <div class="header-actions">
        <button id="clearBtn" class="ghost" data-i18n="popupClear">清空</button>
        <button id="optionsBtn" class="ghost" data-i18n="popupOpenOptions">设置</button>
      </div>
    </header>

    <section class="provider-bar">
      <select id="providerSelect" class="pill-select" data-i18n-title="popupProviderTitle"></select>
      <select id="templateSelect" class="pill-select" data-i18n-title="popupTemplateTitle"></select>
    </section>

    <section id="dropzone" class="dropzone" data-i18n-title="popupDropTitle">
      <span class="dropzone-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5" />
          <path d="M4.5 15.5V19a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-3.5" />
        </svg>
      </span>
      <span data-i18n="popupDropHint">拖拽图片到这里，或点击选择</span>
      <input id="fileInput" type="file" accept="image/*" hidden />
    </section>

    <section id="uploadResult" class="upload-result" hidden>
      <img id="uploadThumb" class="upload-thumb" alt="" />
      <div class="upload-body">
        <p id="uploadText" class="upload-text"></p>
        <div class="upload-actions">
          <button id="uploadCopy" class="mini-btn primary" data-i18n="panelCopy">复制</button>
          <button id="uploadCancel" class="mini-btn" data-i18n="panelCancel">取消</button>
        </div>
      </div>
      <span id="uploadSpinner" class="mini-spinner" hidden></span>
    </section>

    <section class="search-bar">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        data-i18n-ph="popupSearchPh"
        placeholder="搜索历史记录"
      />
      <button
        id="favFilterBtn"
        class="fav-filter"
        data-i18n-title="popupFavOnlyTitle"
        aria-pressed="false"
      >
        ☆
      </button>
    </section>

    <main id="historyList" class="history-list"></main>
    <div id="emptyState" class="empty" hidden>
      <p data-i18n="popupEmpty" id="emptyDefaultText"></p>
      <p id="emptySearchText" class="empty-search" hidden></p>
      <button id="setupApiBtn" class="setup-cta" data-i18n="popupSetupApi" hidden></button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
