<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsPageTitle">Img2Prompt 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <div class="page-title">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2c.7 4.9 3.3 7.5 8.2 8.2-4.9.7-7.5 3.3-8.2 8.2-.7-4.9-3.3-7.5-8.2-8.2 4.9-.7 7.5-3.3 8.2-8.2z"
            />
            <path
              d="M19 2.5c.3 2 1.3 3 3.3 3.3-2 .3-3 1.3-3.3 3.3-.3-2-1.3-3-3.3-3.3 2-.3 3-1.3 3.3-3.3z"
              opacity=".85"
            />
          </svg>
        </span>
        <h1 data-i18n="optionsPageTitle">Img2Prompt 设置</h1>
      </div>
      <p class="hint" data-i18n="optionsHint"></p>

      <p class="card-title" data-i18n="optionsCardApi">API 配置</p>
      <div class="card">
        <label class="field">
          <span data-i18n="optionsApiKey">API Key</span>
          <input id="apiKey" type="password" autocomplete="off" data-i18n-ph="optionsApiKeyPh" />
        </label>

        <label class="field">
          <span data-i18n="optionsBaseUrl">Base URL</span>
          <input id="baseUrl" type="url" autocomplete="off" spellcheck="false" />
        </label>

        <label class="field">
          <span data-i18n="optionsModel">模型</span>
          <input id="model" type="text" autocomplete="off" spellcheck="false" />
        </label>
      </div>

      <p class="card-title" data-i18n="optionsCardGeneral">通用</p>
      <div class="card">
        <label class="field">
          <span data-i18n="optionsDefaultLang">默认语言</span>
          <select id="defaultLang">
            <option value="zh" data-i18n="optionsLangZh">中文</option>
            <option value="en" data-i18n="optionsLangEn">英文</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="saveBtn" class="primary" data-i18n="optionsSave">保存</button>
        <button id="testBtn" data-i18n="optionsTest">测试连接</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
