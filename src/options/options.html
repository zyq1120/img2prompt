<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsPageTitle">Img2Prompt 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <div class="page-title">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2c.7 4.9 3.3 7.5 8.2 8.2-4.9.7-7.5 3.3-8.2 8.2-.7-4.9-3.3-7.5-8.2-8.2 4.9-.7 7.5-3.3 8.2-8.2z"
            />
            <path
              d="M19 2.5c.3 2 1.3 3 3.3 3.3-2 .3-3 1.3-3.3 3.3-.3-2-1.3-3-3.3-3.3 2-.3 3-1.3 3.3-3.3z"
              opacity=".85"
            />
          </svg>
        </span>
        <h1 data-i18n="optionsPageTitle">Img2Prompt 设置</h1>
      </div>
      <p class="hint" data-i18n="optionsHint"></p>

      <p class="card-title" data-i18n="optionsCardProviders">服务商</p>
      <div class="card">
        <div id="providerList" class="provider-list"></div>
        <div class="card-footer">
          <button id="addProviderBtn" class="text-btn" data-i18n="optionsAddProvider">
            ＋ 添加服务商
          </button>
        </div>
      </div>

      <div id="providerEditor" class="card editor" hidden>
        <p class="editor-title" data-i18n="optionsProviderEditorTitle">服务商配置</p>
        <label class="field">
          <span data-i18n="optionsProviderName">名称</span>
          <input id="providerName" type="text" autocomplete="off" data-i18n-ph="optionsProviderNamePh" />
        </label>
        <label class="field">
          <span data-i18n="optionsApiKey">API Key</span>
          <input id="providerKey" type="password" autocomplete="off" data-i18n-ph="optionsApiKeyPh" />
        </label>
        <label class="field">
          <span data-i18n="optionsBaseUrl">Base URL</span>
          <input id="providerBaseUrl" type="url" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span data-i18n="optionsModel">模型</span>
          <input id="providerModel" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <div class="editor-actions">
          <button id="saveProviderBtn" class="primary" data-i18n="optionsSave">保存</button>
          <button id="cancelProviderBtn" data-i18n="optionsCancel">取消</button>
        </div>
      </div>

      <p class="card-title" data-i18n="optionsCardTemplates">提示词模板</p>
      <div class="card">
        <div id="templateList" class="template-list"></div>
        <div class="card-footer">
          <button id="addTemplateBtn" class="text-btn" data-i18n="optionsAddTemplate">
            ＋ 新建模板
          </button>
        </div>
      </div>

      <div id="templateEditor" class="card editor" hidden>
        <p class="editor-title" data-i18n="optionsTemplateEditorTitle">模板编辑</p>
        <label class="field">
          <span data-i18n="optionsTemplateName">模板名称</span>
          <input id="templateName" type="text" autocomplete="off" />
        </label>
        <label class="field">
          <span data-i18n="optionsTemplateFormat">输出格式</span>
          <select id="templateFormat">
            <option value="text" data-i18n="optionsTemplateFormatText">文本</option>
            <option value="json" data-i18n="optionsTemplateFormatJson">结构化 JSON</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="optionsTemplateSystem">System 提示词</span>
          <textarea
            id="templateSystem"
            rows="8"
            spellcheck="false"
            data-i18n-ph="optionsTemplateSystemPh"
          ></textarea>
        </label>
        <label class="field">
          <span data-i18n="optionsTemplateUserZh">User 文本（中文输出时）</span>
          <textarea id="templateUserZh" rows="2"></textarea>
        </label>
        <label class="field">
          <span data-i18n="optionsTemplateUserEn">User 文本（英文输出时）</span>
          <textarea id="templateUserEn" rows="2"></textarea>
        </label>
        <div class="editor-actions">
          <button id="saveTemplateBtn" class="primary" data-i18n="optionsSave">保存</button>
          <button id="cancelTemplateBtn" data-i18n="optionsCancel">取消</button>
        </div>
      </div>

      <p class="card-title" data-i18n="optionsCardGeneral">通用</p>
      <div class="card">
        <label class="field">
          <span data-i18n="optionsDefaultLang">默认语言</span>
          <select id="defaultLang">
            <option value="zh" data-i18n="optionsLangZh">中文</option>
            <option value="en" data-i18n="optionsLangEn">英文</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="saveBtn" class="primary" data-i18n="optionsSave">保存</button>
        <button id="testBtn" data-i18n="optionsTest">测试连接</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
